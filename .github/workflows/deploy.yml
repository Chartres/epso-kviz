name: CI & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run per ref; PRs don't cancel the main deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate: typecheck · test · build · e2e. Runs on push and every PR.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - run: npx playwright install --with-deps chromium
      - name: E2E (Playwright)
        run: npm run e2e
      # e2e rebuilds dist at '/', so the Pages build comes last. PAGES_BASE is a repo
      # variable: '/epso-kviz/' while on github.io, unset once the custom domain is live.
      - name: Build for Pages
        run: npm run build
        env:
          VITE_BASE: ${{ vars.PAGES_BASE }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Deploy only from a push to main — never from a PR.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release tag below
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # FLYWHEEL-STANDARD §5: tag the deployed commit deploy-<yyyy-mm-dd>[-n] (UTC). Same logic as
      # flywheel scripts/release-tag.sh deploy; never moves a tag, a re-run adds none. A tag pushed
      # with GITHUB_TOKEN triggers no workflow.
      - uses: actions/checkout@v4
      - name: Tag the deployed commit
        run: |
          remote=$(git ls-remote --tags origin)
          awk -v s="$GITHUB_SHA" '$1==s && $2 ~ /^refs\/tags\/deploy-/ {f=1} END {exit !f}' <<<"$remote" && exit 0
          base=deploy-$(date -u +%F)
          n=$(grep -cE "refs/tags/$base(-[0-9]+)?$" <<<"$remote" || true)
          name=$base; [ "$n" -gt 0 ] && name=$base-$((n + 1))
          git push origin "$GITHUB_SHA:refs/tags/$name"
          echo "tagged $name"
